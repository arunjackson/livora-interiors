<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Project — Ar Bee Studio</title>
    <link rel="icon" href="https://i.ibb.co/4nVFMjJH/Whats-App-Image-2026-08-18-at-19-58-03.jpg" type="image/jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="font-fix.css" />
    
    <style>
        .client-section { padding: 50px max(28px, 4vw) 80px; min-height: calc(100vh - 112px); background: var(--cream); }
        
        /* Premium Header */
        .hero-dash { border-bottom: 1px solid var(--line); padding-bottom: 30px; margin-bottom: 40px; display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 20px;}
        .hero-dash h2 { font-family: "Cormorant Garamond", serif; font-size: clamp(38px, 4.5vw, 56px); font-weight: 600; margin: 0; color: var(--dark); letter-spacing: -1px;}
        .hero-dash .sub { color: var(--muted); font-weight: 500; font-size: 17px; margin-top: 6px; display: block; letter-spacing: 0.5px;}
        .stage-badge { background: var(--gold); color: var(--dark); padding: 12px 32px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; font-size: 15px; border-radius: 2px; }

        /* Modern Split Layout */
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 40px; }
        
        /* Left Column: Progress & Stage */
        .stage-card { background: #fff; border: 1px solid var(--line); padding: 30px; border-radius: 6px; box-shadow: 0 8px 25px rgba(45, 36, 31, 0.04); }
        .stage-image-wrap { width: 100%; height: 240px; border-radius: 4px; overflow: hidden; border: 1px solid var(--line); margin-bottom: 25px; }
        .stage-image-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.7s ease; }
        .stage-image-wrap:hover img { transform: scale(1.03); }
        .stage-info h3 { font-size: 28px; margin: 0 0 8px; color: var(--dark); font-weight: 600; }
        .stage-info p { color: var(--muted); font-weight: 500; margin: 0; line-height: 1.6; }
        
        .progress-block { margin-top: 25px; }
        .progress-header { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; }
        .progress-header span { color: var(--gold); }
        .progress-track { width: 100%; height: 8px; background: #eae4db; border-radius: 6px; overflow: hidden; position: relative; }
        .progress-fill { height: 100%; background: var(--gold); border-radius: 6px; transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1); width: 0%; }

        /* Right Column: Updates & Files */
        .feed-card { background: #fff; border: 1px solid var(--line); padding: 30px; border-radius: 6px; box-shadow: 0 8px 25px rgba(45, 36, 31, 0.04); }
        .feed-card h3 { font-size: 24px; margin: 0 0 20px; color: var(--dark); border-bottom: 1px solid var(--line); padding-bottom: 15px; font-weight: 600; font-family: "Cormorant Garamond", serif; }
        
        .updates-timeline { display: flex; flex-direction: column; gap: 20px; }
        .update-item { border-left: 2px solid var(--gold); padding: 0 0 0 20px; position: relative; }
        .update-item::before { content: ''; position: absolute; left: -6px; top: 2px; width: 10px; height: 10px; background: var(--gold); border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 3px var(--cream); }
        .update-item .date { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; display: block; }
        .update-item p { margin: 0; font-weight: 500; color: var(--dark); font-size: 15px; line-height: 1.6; }
        .empty-updates { color: var(--muted); font-style: italic; padding: 10px 0; font-size: 15px; }

        .file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; margin-top: 10px; }
        .file-item { border: 1px solid var(--line); background: var(--cream); padding: 15px; text-align: center; transition: 0.3s; border-radius: 4px; }
        .file-item:hover { border-color: var(--gold); transform: translateY(-3px); box-shadow: 0 6px 15px rgba(0,0,0,0.04); }
        .file-item a { color: var(--dark); text-decoration: none; font-weight: 500; font-size: 13px; display: block; margin-top: 10px; word-break: break-all; }
        .file-item img { max-width: 100%; max-height: 100px; object-fit: contain; background: transparent; }
        .file-icon { font-size: 32px; color: var(--gold); display: block; margin-bottom: 5px; }

        .no-project { text-align: center; padding: 120px 20px; border: 1px solid var(--line); background: #fff; border-radius: 6px; }
        .no-project h3 { font-size: 30px; margin-bottom: 15px; color: var(--dark); font-weight: 600;}
        .no-project p { color: var(--muted); font-weight: 500; }

        /* Mobile Responsiveness */
        @media (max-width: 900px) { .dashboard-grid { grid-template-columns: 1fr; gap: 30px; } .stage-image-wrap { height: 200px; } }
        @media (max-width: 600px) { .hero-dash h2 { font-size: 36px; } .stage-info h3 { font-size: 24px; } .feed-card h3 { font-size: 22px; } .file-grid { grid-template-columns: 1fr 1fr; } }
    </style>
</head>
<body>
    <header class="site-header">
        <a class="brand" href="index.html"><img src="https://i.ibb.co/4nVFMjJH/Whats-App-Image-2026-08-18-at-19-58-03.jpg" alt="Ar Bee Studio Logo" style="max-width:80px;height:auto;" /></a>
        <span style="color: var(--gold); font-weight: 700; text-transform: uppercase; letter-spacing: 2px;">Project Portal</span>
        <div><button class="button button-outline" onclick="signOut()" style="padding: 0 30px; min-height: 40px; height: 40px; font-size: 11px;">Log Out</button></div>
    </header>

    <section class="client-section" id="client-content"></section>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
    <script>
        (function() {
            const container = document.getElementById('client-content');
            const stageDescriptions = [
                "Free Site Visit", "Free Consultation", "Understanding Your Requirements", 
                "Budget Planning", "Commitment Towards Project", "Preparing 2D Layout", 
                "3D Visualisation", "Preparing Quotation", "Approval & Advance Payment",
                "Completion of Structure", "Interim Payment", "Final Handover"
            ];
            
            async function loadClientPortal() {
                const user = await checkUser();
                if (!user) { window.location.href = 'login.html'; return; }
                
                const { data, error } = await window._supabaseClient.from('projects').select('*').eq('customer_email', user.email);
                if (error || !data || data.length === 0) {
                    container.innerHTML = `<div class="no-project"><h3>No active project found</h3><p>We currently do not have any project associated with <strong>${user.email}</strong>.</p><a href="index.html" class="button button-outline" style="margin-top: 25px;">Return to Home</a></div>`;
                    return;
                }
                
                const project = data[0];
                const progress = (project.current_stage / 12) * 100;
                const updates = project.updates || [];
                const files = project.files || [];
                const currentStageIndex = project.current_stage - 1;

                container.innerHTML = `
                    <div class="hero-dash">
                        <div>
                            <h2>${project.project_name}</h2>
                            <span class="sub">👤 ${project.customer_name}</span>
                        </div>
                        <div><span class="stage-badge">Stage ${project.current_stage} / 12</span></div>
                    </div>

                    <div class="dashboard-grid">
                        <!-- Left Column -->
                        <div class="stage-card">
                            <div class="stage-image-wrap">
                                <img src="images/${project.current_stage}.jpg" alt="Stage ${project.current_stage}" onerror="this.src='https://images.unsplash.com/photo-1600607686527-6fb886090705?auto=format&fit=crop&w=800&q=80'">
                            </div>
                            <div class="stage-info">
                                <h3>Stage ${project.current_stage}: ${stageDescriptions[currentStageIndex]}</h3>
                                <p>We are currently working through this step of your project. Our team is committed to delivering exceptional quality.</p>
                            </div>
                            <div class="progress-block">
                                <div class="progress-header">
                                    <span>Progress</span>
                                    <span>${Math.round(progress)}% Complete</span>
                                </div>
                                <div class="progress-track">
                                    <div class="progress-fill" style="width:${progress}%"></div>
                                </div>
                            </div>
                        </div>

                        <!-- Right Column -->
                        <div class="feed-card">
                            <h3>Timeline Updates</h3>
                            <div class="updates-timeline">
                                ${updates.length === 0 ? 
                                    `<p class="empty-updates">No updates have been posted yet. Our team will update this space soon.</p>` : 
                                    updates.slice().reverse().map(u => `
                                        <div class="update-item">
                                            <span class="date">${u.date}</span>
                                            <p>${u.note}</p>
                                        </div>
                                    `).join('')
                                }
                            </div>

                            ${files.length > 0 ? `
                            <div style="margin-top: 35px;">
                                <h3 style="font-family: 'Cormorant Garamond', serif; font-size: 24px; margin: 0 0 15px 0; color: var(--dark); border-bottom: 1px solid var(--line); padding-bottom: 15px;">Project Documents</h3>
                                <div class="file-grid">
                                    ${files.map(f => `
                                        <div class="file-item">
                                            ${f.type.startsWith('image/') ? `<img src="${f.url}" alt="${f.name}" />` : `<span class="file-icon">📄</span>`}
                                            <a href="${f.url}" target="_blank" download>${f.name.length > 25 ? f.name.substring(0, 22) + '...' : f.name}</a>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>` : ''}
                        </div>
                    </div>
                `;
            }
            loadClientPortal();
        })();
    </script>
</body>
</html>
